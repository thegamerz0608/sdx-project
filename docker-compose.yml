version: "3.8"

services:
  # -------------------------------------------------------------
  # Relational Database: PostgreSQL 16
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: faculty_erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: faculty_erp_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./SNK(project)/database/postgres_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./SNK(project)/database/postgres_seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d faculty_erp_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    driver: local
