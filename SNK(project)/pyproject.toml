[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faculty-attendance-leave-erp"
version = "3.1.0"
description = "AI-Enabled Faculty Attendance, Leave and Substitute Management ERP"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "MCA Project Team", email = "research@institution.edu.in"}
]
dependencies = [
    "PySide6>=6.5.0",
    "mysql-connector-python>=8.0.33",
    "PyMySQL>=1.1.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "joblib>=1.3.0",
    "reportlab>=4.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "qrcode>=7.0.0",
    "cryptography>=41.0.0",
    "python-docx>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "bandit>=1.7.5",
    "pip-audit>=2.6.0",
    "scikit-learn>=1.3.0",
    "locust>=2.15.0",
    "ortools>=9.7.0",
]

# -------------------------------------------------------------
# Ruff Linter & Formatter Configuration
# -------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    "venv",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "backups",
    "archives",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "S101",  # use of assert (common in pytest test suites)
    "S104",  # possible binding to all interfaces (0.0.0.0 in local kiosk server)
    "S105",  # possible hardcoded password (mock demo data keys)
    "S106",  # possible hardcoded password in func call
    "S311",  # standard pseudo-random generators (used for synthetic text modifiers, not crypt)
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["nlp", "services", "repositories", "utils", "models", "database", "ui", "config"]

# -------------------------------------------------------------
# Mypy Static Type Checker Configuration
# -------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_decorators = false
exclude = [
    "venv",
    "tests",
    "build",
    "dist",
]

# -------------------------------------------------------------
# Bandit AST Security Analysis Configuration
# -------------------------------------------------------------
[tool.bandit]
targets = ["nlp", "services", "repositories", "utils", "models"]
exclude_dirs = ["tests", "venv", ".venv", "build"]
skips = ["B101", "B311"]

# -------------------------------------------------------------
# Pytest & Coverage Configuration
# -------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["nlp", "services", "repositories", "utils", "models"]
omit = [
    "tests/*",
    "venv/*",
    "ui/*",
    "run.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "except ImportError:",
]
show_missing = true
fail_under = 75
